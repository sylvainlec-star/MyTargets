// The original script used org.ajoberstar:grgit (hosted on the now defunct JCenter/Bintray)
// to derive the version from git tags. That dependency can no longer be resolved, so the
// fallback values are used.
ext {
    gitVersionCode = 1
    gitVersionName = "debug"
    gitBranchName = System.getenv('TRAVIS') == 'true' ? System.getenv('TRAVIS_BRANCH') : "debug"
}
